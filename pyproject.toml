[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "weewx-db"
version = "0.2.0"
requires-python = ">=3.9"
description = "Rust column store, SQL connection and optional WeeWX driver"
license = "GPL-3.0-only"

[tool.maturin]
python-source = "python"
module-name = "weewxdb._weewxdb"
features = ["python"]
